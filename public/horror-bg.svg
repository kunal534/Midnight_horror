<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="horrorPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Eerie eyes -->
      <circle cx="20" cy="20" r="1.5" fill="rgba(139,0,0,0.15)" opacity="0.8"/>
      <circle cx="80" cy="30" r="1" fill="rgba(139,0,0,0.12)" opacity="0.7"/>
      <circle cx="50" cy="60" r="1.2" fill="rgba(139,0,0,0.1)" opacity="0.6"/>
      <circle cx="70" cy="80" r="1.5" fill="rgba(139,0,0,0.15)" opacity="0.8"/>
      
      <!-- Creepy lines -->
      <path d="M10,50 Q30,30 50,50 T90,50" stroke="rgba(139,0,0,0.08)" stroke-width="0.5" fill="none" opacity="0.6"/>
      <path d="M15,80 Q35,60 55,80 T95,80" stroke="rgba(139,0,0,0.06)" stroke-width="0.3" fill="none" opacity="0.5"/>
      
      <!-- Shadows -->
      <ellipse cx="25" cy="25" rx="8" ry="4" fill="rgba(0,0,0,0.1)" opacity="0.3"/>
      <ellipse cx="75" cy="75" rx="6" ry="3" fill="rgba(0,0,0,0.08)" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#horrorPattern)"/>
</svg>

